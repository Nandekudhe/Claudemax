name: Build Clean APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Prepare Web Files & Build APK
        run: |
          # 1. www folder banakar saari files usme daalna
          mkdir -p www
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' ! -name 'www' -exec cp -r {} www/ \;

          # 2. Capacitor install & init
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Claudemax" "com.claudemax.app" --web-dir www
          npx cap add android
          npx cap sync android

          # 3. APK generate karna
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Clean APK
        uses: actions/upload-artifact@v4
        with:
          name: Clean-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
