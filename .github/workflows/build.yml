name: Build Clean APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Prepare Web Files & Build APK
        run: |
          mkdir -p www
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' ! -name 'www' -exec cp -r {} www/ \;

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Claudemax" "com.claudemax.app" --web-dir www
          npx cap add android
          npx cap sync android

          # Fix Kotlin Duplicate Class issue
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Clean APK
        uses: actions/upload-artifact@v4
        with:
          name: Clean-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
